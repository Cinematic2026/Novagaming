<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NOVA Live Global Chat</title>
  
  <!-- Iconify SVG Icons & Google Fonts -->
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #070a0f;
      --panel: #0d131f;
      --panel-accent: #151c2d;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.35);
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --border: rgba(255, 255, 255, 0.07);
      --bubble-own: linear-gradient(135deg, var(--accent), #1d4ed8);
      --bubble-other: #161f30;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .chat-app {
      width: 100%;
      max-width: 600px;
      height: 100vh;
      background: var(--panel);
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 80px rgba(0, 0, 0, 0.9);
      position: relative;
      overflow: hidden;
    }

    @media (min-height: 700px) and (min-width: 620px) {
      .chat-app {
        height: 92vh;
        border-radius: 24px;
        border: 1px solid var(--border);
      }
    }

    /* Header */
    .chat-header {
      padding: 14px 18px;
      background: rgba(13, 19, 31, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.2);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      color: #4ade80;
      font-weight: 600;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    .header-right-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-badge {
      font-size: 0.75rem;
      color: var(--accent);
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.25);
      padding: 6px 12px;
      border-radius: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn-settings {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-dim);
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: color 0.2s, background 0.2s, transform 0.1s;
    }
    .icon-btn-settings:hover { color: var(--text); background: rgba(255, 255, 255, 0.1); }
    .icon-btn-settings:active { transform: scale(0.95); }

    /* Viewport Mensajes */
    .messages-viewport {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .messages-viewport::-webkit-scrollbar { width: 5px; }
    .messages-viewport::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

    .message-group {
      display: flex;
      flex-direction: column;
      max-width: 80%;
      position: relative;
      touch-action: pan-y;
      transition: transform 0.15s ease-out;
      animation: slideUp 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-group.own { align-self: flex-end; align-items: flex-end; }
    .message-group.other { align-self: flex-start; align-items: flex-start; }

    .msg-author {
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-bottom: 4px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .msg-bubble-wrapper { position: relative; width: 100%; cursor: pointer; }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.93rem;
      line-height: 1.5;
      word-break: break-word;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .message-group.own .msg-bubble {
      background: var(--bubble-own);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message-group.other .msg-bubble {
      background: var(--bubble-other);
      color: var(--text);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border);
    }

    /* Cita de Respuesta */
    .reply-quote {
      background: rgba(0, 0, 0, 0.25);
      border-left: 3px solid var(--accent);
      border-radius: 6px;
      padding: 6px 10px;
      margin-bottom: 8px;
      font-size: 0.78rem;
    }
    .reply-quote-author { font-weight: 700; color: var(--accent); margin-bottom: 2px; }
    .reply-quote-text { color: rgba(255, 255, 255, 0.85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Meta Datos del Mensaje */
    .msg-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 4px;
      padding: 0 2px;
    }

    .message-group.other .msg-meta { color: var(--text-dim); }

    .expiry-tag {
      display: flex;
      align-items: center;
      gap: 2px;
      color: #f59e0b;
      font-weight: 600;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: #ef4444;
      cursor: pointer;
      display: flex;
      align-items: center;
      margin-left: 4px;
      opacity: 0.75;
      transition: opacity 0.2s;
    }
    .delete-btn:hover { opacity: 1; }

    /* Reacciones */
    .reaction-trigger-zone {
      position: absolute;
      top: -34px;
      display: none;
      background: #151d2a;
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 4px 10px;
      gap: 8px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      z-index: 10;
    }

    .message-group.own .reaction-trigger-zone { right: 0; }
    .message-group.other .reaction-trigger-zone { left: 0; }
    .msg-bubble-wrapper:hover .reaction-trigger-zone { display: flex; }

    .react-opt { cursor: pointer; font-size: 1.15rem; transition: transform 0.15s ease; }
    .react-opt:hover { transform: scale(1.35); }

    .active-reactions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }

    .reaction-pill {
      background: rgba(21, 28, 45, 0.9);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3px 8px;
      font-size: 0.73rem;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }
    .reaction-pill:hover { background: rgba(59, 130, 246, 0.2); }

    /* Banner de Respuesta */
    .reply-preview-bar {
      background: rgba(21, 29, 45, 0.95);
      border-top: 1px solid var(--border);
      padding: 8px 16px;
      display: none;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
    }
    .reply-preview-bar.active { display: flex; }
    .reply-preview-info { border-left: 3px solid var(--accent); padding-left: 8px; }
    .reply-preview-title { font-weight: 700; color: var(--accent); }
    .reply-preview-text { color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }

    /* Footer / Input Bar Pro */
    .chat-footer {
      padding: 12px 16px;
      background: rgba(13, 19, 31, 0.95);
      border-top: 1px solid var(--border);
      position: relative;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 6px 8px 6px 18px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .input-wrapper input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.92rem;
      outline: none;
    }

    .char-counter {
      font-size: 0.68rem;
      color: var(--text-dim);
      margin-right: 6px;
    }

    .input-actions { display: flex; align-items: center; gap: 6px; }

    .action-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
    }

    .action-btn:hover { color: var(--text); background: rgba(255, 255, 255, 0.05); }

    .send-btn { background: var(--accent); color: white; }
    .send-btn:hover { background: var(--accent); color: white; box-shadow: 0 0 15px var(--accent-glow); }

    /* Floating Panels */
    .emoji-picker-panel, .settings-panel {
      position: absolute;
      bottom: 75px;
      background: #111723;
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      display: none;
      flex-direction: column;
      z-index: 50;
      overflow: hidden;
      animation: fadeIn 0.15s ease-out;
    }

    .emoji-picker-panel { right: 16px; width: 310px; height: 250px; }
    .settings-panel { right: 16px; width: 310px; padding: 16px; gap: 14px; }

    .emoji-picker-panel.active, .settings-panel.active { display: flex; }

    .emoji-picker-header, .settings-title {
      padding: 10px 14px;
      font-size: 0.78rem;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }

    .settings-title { padding: 0 0 10px 0; font-size: 0.9rem; color: var(--text); }

    .emoji-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      padding: 12px;
      overflow-y: auto;
    }

    .emoji-grid-item {
      font-size: 1.3rem;
      text-align: center;
      cursor: pointer;
      padding: 4px;
      border-radius: 8px;
      transition: background 0.15s, transform 0.1s;
    }

    .emoji-grid-item:hover { background: rgba(255, 255, 255, 0.08); transform: scale(1.2); }

    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-group label { font-size: 0.72rem; color: var(--text-dim); }
    .field-group input, .field-group select {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 10px;
      color: var(--text);
      outline: none;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<div class="chat-app">
  <div class="chat-header">
    <div class="brand">
      <iconify-icon icon="solar:chat-round-line-bold-duotone" style="font-size: 1.6rem; color: var(--accent);"></iconify-icon>
      <div>
        <h3 style="font-size: 0.95rem; font-weight: 700;">CHAT GLOBAL</h3>
      </div>
      <div class="live-indicator">
        <div class="live-dot"></div> LIVE
      </div>
    </div>
    <div class="header-right-actions">
      <div class="user-badge" id="userBadge">
        <iconify-icon icon="solar:user-circle-bold"></iconify-icon>
        <span id="badgeName">Anónimo</span>
      </div>
      <!-- Botón Ajustes Superior Derecho -->
      <button class="icon-btn-settings" id="settingsToggleBtn" title="Ajustes de usuario">
        <iconify-icon icon="solar:settings-bold-duotone" style="font-size: 1.25rem;"></iconify-icon>
      </button>
    </div>
  </div>

  <!-- Panel Ajustes Flotante Derecho -->
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-title">Personalización del Chat</div>
    <div class="field-group">
      <label>Tu Nombre de Usuario:</label>
      <input type="text" id="usernameInput" placeholder="Escribe tu nombre..." maxlength="20">
    </div>
    <div class="field-group">
      <label>Color de Acento:</label>
      <select id="colorSelect">
        <option value="#3b82f6">Azul Eléctrico</option>
        <option value="#8b5cf6">Morado Neón</option>
        <option value="#10b981">Verde Esmeralda</option>
        <option value="#f43f5e">Rosa Carmesí</option>
        <option value="#f59e0b">Ámbar Fuego</option>
      </select>
    </div>
    <button class="action-btn send-btn" id="saveSettingsBtn" style="width: 100%; border-radius: 10px; height: 36px; font-size: 0.8rem; font-weight: 600;">Guardar Cambios</button>
  </div>

  <!-- Viewport Mensajes -->
  <div class="messages-viewport" id="viewport"></div>

  <!-- Banner Respuesta Activa -->
  <div class="reply-preview-bar" id="replyBar">
    <div class="reply-preview-info">
      <div class="reply-preview-title" id="replyAuthor">Respondiendo a User</div>
      <div class="reply-preview-text" id="replyText">Mensaje...</div>
    </div>
    <button class="icon-btn-settings" id="cancelReplyBtn" style="width:28px; height:28px; border:none;"><iconify-icon icon="solar:close-circle-bold"></iconify-icon></button>
  </div>

  <!-- Emoji Selector Flotante -->
  <div class="emoji-picker-panel" id="emojiPicker">
    <div class="emoji-picker-header">EMOJIS RÁPIDOS</div>
    <div class="emoji-grid" id="emojiGrid"></div>
  </div>

  <div class="chat-footer">
    <form class="input-wrapper" id="chatForm">
      <input type="text" id="msgInput" placeholder="Escribe un mensaje..." maxlength="300" autocomplete="off" required>
      <span class="char-counter" id="charCounter">300</span>
      <div class="input-actions">
        <button type="button" class="action-btn" id="emojiToggleBtn" title="Emojis">
          <iconify-icon icon="solar:smile-circle-bold-duotone" style="font-size: 1.35rem;"></iconify-icon>
        </button>
        <button type="submit" class="action-btn send-btn" title="Enviar">
          <iconify-icon icon="solar:plain-3-bold-duotone" style="font-size: 1.25rem;"></iconify-icon>
        </button>
      </div>
    </form>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getDatabase, 
    ref, 
    push, 
    remove,
    onChildAdded, 
    onChildChanged, 
    onChildRemoved,
    runTransaction 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDYDq_dAc2fJI8HYwe7qXFM7BueiC3yDPQ",
    authDomain: "nova-api-3a052.firebaseapp.com",
    databaseURL: "https://nova-api-3a052-default-rtdb.firebaseio.com",
    projectId: "nova-api-3a052",
    storageBucket: "nova-api-3a052.firebasestorage.app",
    messagingSenderId: "300651642455",
    appId: "1:300651642455:web:533eeb0e6dac60f825ed12"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const EXPIRATION_MS = 72 * 60 * 60 * 1000;

  // Estado del Usuario y Configuración
  let activeReply = null;
  function setupIdentity() {
    let saved = localStorage.getItem('nova_user');
    if (!saved) {
      const randomId = Math.floor(1000 + Math.random() * 9000);
      saved = JSON.stringify({ uid: `usr_${Date.now()}_${randomId}`, name: `User #${randomId}`, color: '#3b82f6' });
      localStorage.setItem('nova_user', saved);
    }
    return JSON.parse(saved);
  }

  let user = setupIdentity();
  const messagesRef = ref(db, 'global_chat');
  const viewport = document.getElementById('viewport');

  function applyUserConfig() {
    document.getElementById('badgeName').textContent = user.name;
    document.getElementById('usernameInput').value = user.name;
    document.getElementById('colorSelect').value = user.color || '#3b82f6';
    document.documentElement.style.setProperty('--accent', user.color || '#3b82f6');
  }
  applyUserConfig();

  // Sonido de envío sin librerías usando Web Audio API
  function playPopSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.08);
    } catch (e) {}
  }

  // Panel Ajustes
  const settingsPanel = document.getElementById('settingsPanel');
  document.getElementById('settingsToggleBtn').onclick = (e) => {
    e.stopPropagation();
    settingsPanel.classList.toggle('active');
    emojiPicker.classList.remove('active');
  };

  document.getElementById('saveSettingsBtn').onclick = () => {
    const nameVal = document.getElementById('usernameInput').value.trim();
    if (nameVal) user.name = nameVal;
    user.color = document.getElementById('colorSelect').value;
    localStorage.setItem('nova_user', JSON.stringify(user));
    applyUserConfig();
    settingsPanel.classList.remove('active');
  };

  // Galería de Emojis
  const emojiList = ['🔥','😂','❤️','🍿','👏','😎','🙌','🚀','💀','🎉','⚡','😍','🤔','💯','🥳','👍','👎','💩','👀','✨','💪','🎯','🤩','👑'];
  const emojiGrid = document.getElementById('emojiGrid');
  const emojiPicker = document.getElementById('emojiPicker');
  const emojiToggleBtn = document.getElementById('emojiToggleBtn');
  const msgInput = document.getElementById('msgInput');
  const charCounter = document.getElementById('charCounter');

  emojiList.forEach(emoji => {
    const item = document.createElement('div');
    item.className = 'emoji-grid-item';
    item.textContent = emoji;
    item.onclick = () => {
      msgInput.value += emoji;
      updateCounter();
      msgInput.focus();
    };
    emojiGrid.appendChild(item);
  });

  function updateCounter() {
    charCounter.textContent = 300 - msgInput.value.length;
  }
  msgInput.addEventListener('input', updateCounter);

  emojiToggleBtn.onclick = (e) => {
    e.stopPropagation();
    emojiPicker.classList.toggle('active');
    settingsPanel.classList.remove('active');
  };

  document.onclick = (e) => {
    if (!emojiPicker.contains(e.target) && e.target !== emojiToggleBtn) emojiPicker.classList.remove('active');
    if (!settingsPanel.contains(e.target) && e.target !== document.getElementById('settingsToggleBtn')) settingsPanel.classList.remove('active');
  };

  // Cancelar Respuesta
  document.getElementById('cancelReplyBtn').onclick = () => {
    activeReply = null;
    document.getElementById('replyBar').classList.remove('active');
  };

  // Enviar mensaje
  document.getElementById('chatForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const val = msgInput.value.trim();
    if (!val) return;

    const payload = {
      uid: user.uid,
      author: user.name,
      text: val,
      timestamp: Date.now(),
      reactions: {}
    };

    if (activeReply) payload.replyTo = activeReply;

    push(messagesRef, payload);
    playPopSound();

    msgInput.value = '';
    updateCounter();
    activeReply = null;
    document.getElementById('replyBar').classList.remove('active');
    emojiPicker.classList.remove('active');
  });

  // Calculador de Expiración
  function getRemainingTimeString(timestamp) {
    const remaining = EXPIRATION_MS - (Date.now() - timestamp);
    if (remaining <= 0) return 'Expirado';

    const hours = Math.floor(remaining / (1000 * 60 * 60));
    const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
    return hours > 0 ? `${hours}h ${minutes}m` : `${minutes}m`;
  }

  function formatTime(timestamp) {
    return new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function setReplyTarget(data) {
    activeReply = { author: data.author, text: data.text };
    document.getElementById('replyAuthor').textContent = `Respondiendo a ${data.author}`;
    document.getElementById('replyText').textContent = data.text;
    document.getElementById('replyBar').classList.add('active');
    msgInput.focus();
  }

  // Renderizar Mensaje
  function createOrUpdateMessage(data, key) {
    if (Date.now() - data.timestamp >= EXPIRATION_MS) return;

    let el = document.getElementById(`m-${key}`);
    const isOwn = data.uid === user.uid;

    if (!el) {
      el = document.createElement('div');
      el.id = `m-${key}`;
      el.className = `message-group ${isOwn ? 'own' : 'other'}`;
      viewport.appendChild(el);

      // Deslizar para responder (Swipe derecha)
      let touchStartX = 0;
      el.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive: true});
      el.addEventListener('touchmove', e => {
        let diff = e.touches[0].clientX - touchStartX;
        if (diff > 0 && diff < 70) el.style.transform = `translateX(${diff}px)`;
      }, {passive: true});
      el.addEventListener('touchend', e => {
        if (parseInt(el.style.transform.replace('translateX(', '') || 0) > 35) setReplyTarget(data);
        el.style.transform = 'translateX(0px)';
      });
    }

    let reactionsHTML = '';
    if (data.reactions) {
      const counts = {};
      Object.values(data.reactions).forEach(emoji => { if (emoji) counts[emoji] = (counts[emoji] || 0) + 1; });
      for (const [emoji, count] of Object.entries(counts)) {
        reactionsHTML += `<div class="reaction-pill" onclick="window.sendReaction('${key}', '${emoji}')">${emoji} ${count}</div>`;
      }
    }

    let replyHTML = '';
    if (data.replyTo) {
      replyHTML = `
        <div class="reply-quote">
          <div class="reply-quote-author">${sanitize(data.replyTo.author)}</div>
          <div class="reply-quote-text">${sanitize(data.replyTo.text)}</div>
        </div>
      `;
    }

    const deleteHTML = isOwn ? `
      <button class="delete-btn" onclick="window.deleteMsg('${key}')" title="Eliminar mensaje">
        <iconify-icon icon="solar:trash-bin-trash-bold" style="font-size: 0.75rem;"></iconify-icon>
      </button>
    ` : '';

    const timeStr = formatTime(data.timestamp);
    const expireStr = getRemainingTimeString(data.timestamp);

    el.innerHTML = `
      <span class="msg-author">${sanitize(data.author)}</span>
      <div class="msg-bubble-wrapper" onclick="window.triggerReply('${key}')">
        <div class="reaction-trigger-zone">
          <span class="react-opt" onclick="window.sendReaction('${key}', '👍')">👍</span>
          <span class="react-opt" onclick="window.sendReaction('${key}', '❤️')">❤️</span>
          <span class="react-opt" onclick="window.sendReaction('${key}', '😂')">😂</span>
          <span class="react-opt" onclick="window.sendReaction('${key}', '🔥')">🔥</span>
          <span class="react-opt" onclick="window.sendReaction('${key}', '💩')">💩</span>
        </div>
        <div class="msg-bubble">
          ${replyHTML}
          ${sanitize(data.text)}
        </div>
      </div>
      <div class="active-reactions">${reactionsHTML}</div>
      <div class="msg-meta">
        <span>${timeStr}</span>
        <span>•</span>
        <span class="expiry-tag">
          <iconify-icon icon="solar:clock-circle-bold" style="font-size: 0.75rem;"></iconify-icon>
          ${expireStr}
        </span>
        ${deleteHTML}
      </div>
    `;

    el.dataset.payload = JSON.stringify(data);
    viewport.scrollTop = viewport.scrollHeight;
  }

  // Listeners Firebase
  onChildAdded(messagesRef, snap => createOrUpdateMessage(snap.val(), snap.key));
  onChildChanged(messagesRef, snap => createOrUpdateMessage(snap.val(), snap.key));
  onChildRemoved(messagesRef, snap => {
    const el = document.getElementById(`m-${snap.key}`);
    if (el) el.remove();
  });

  window.sendReaction = (key, emoji) => {
    const reactRef = ref(db, `global_chat/${key}/reactions/${user.uid}`);
    runTransaction(reactRef, curr => (curr === emoji ? null : emoji));
  };

  window.deleteMsg = (key) => {
    const msgRef = ref(db, `global_chat/${key}`);
    remove(msgRef);
  };

  window.triggerReply = (key) => {
    const el = document.getElementById(`m-${key}`);
    if (el && el.dataset.payload) setReplyTarget(JSON.parse(el.dataset.payload));
  };

  function sanitize(str) {
    return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
  }
</script>
</body>
</html>
